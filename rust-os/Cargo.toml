[package]
name = "rust-os"
version = "0.1.0"
edition = "2021"
authors = ["Rust OS Developers"]
license = "MIT OR Apache-2.0"
description = "A minimal but real operating system written in Rust"

[dependencies]
bootloader = "0.9.23"
volatile = "0.4.6"
spin = "0.9.8"
x86_64 = "0.14.10"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
